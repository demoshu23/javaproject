trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
# ---------------------------------------------------------
# 0. Fix MSDO config resolution on Linux
# ---------------------------------------------------------
- bash: |
    echo "Preparing MSDO config for Linux..."
    cp msdo-config.json msdo-config-linux.json
  displayName: "Prepare MSDO Linux config"

# ---------------------------------------------------------
# 1. Microsoft Security DevOps (MSDO)
# ---------------------------------------------------------
- task: MicrosoftSecurityDevOps@1
  displayName: "Run Microsoft Security DevOps"
  inputs:
    config: 'msdo-config.json'
    publish: true
    break: true

# ---------------------------------------------------------
# 2. Build with Maven
# ---------------------------------------------------------
- task: Maven@3
  displayName: "Build Maven Project"
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.11'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    goals: 'package'

# ---------------------------------------------------------
# 3. Copy WAR artifacts
# ---------------------------------------------------------
- task: CopyFiles@2
  displayName: "Copy WAR files"
  inputs:
    Contents: '**/*.war'
    TargetFolder: '$(build.artifactstagingdirectory)'

# ---------------------------------------------------------
# 4. Publish build artifacts
# ---------------------------------------------------------
- task: PublishBuildArtifacts@1
  displayName: "Publish build artifacts"
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'demofile'
    publishLocation: 'Container'
